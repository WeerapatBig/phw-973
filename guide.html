<header class="site-header">

      <p class="sub" id="pg-eyebrow">How to Play</p>

<script src="render.js"></script>
<script src="lightbox.js"></script>
<script>
fetch('content/guide.json', { cache: 'no-cache' })
  .then(function (r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  })
  .then(function (doc) {
    PHW.render(doc, {
      eyebrow: document.getElementById('pg-eyebrow'),
      title:   document.getElementById('pg-title'),
      intro:   document.getElementById('pg-intro'),
      toc:     document.getElementById('pg-toc'),
      body:    document.getElementById('pg-body')
    });
  })
  .catch(function (err) {
    document.getElementById('pg-body').innerHTML =
      '<div class="tip warn"><p><strong>The guide could not be loaded.</strong> ' +
      'Please refresh the page, and tell an officer if it keeps happening. (' + err.message + ')</p></div>';
  });
</script>

</body>
